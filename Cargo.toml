[package]
name = "shacl-af-playground"
version = "0.1.0"
edition = "2024"
description = "Run SHACL Advanced Features rules (sh:TripleRule, sh:SPARQLRule) on RDF data, in a browser playground or from the command line"
authors = ["Mathias Vanden Auweele <mathias@matdata.eu>"]
license = "Apache-2.0"
homepage = "https://github.com/Matdata-eu/shacl-af-playground"
repository = "https://github.com/Matdata-eu/shacl-af-playground"
categories = ["command-line-utilities"]
keywords = ["rdf", "shacl", "rules", "inference", "sparql"]
readme = "README.md"

[dependencies]
anyhow = "1"
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "json", "query"] }
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
oxrdf = { version = "0.3", features = ["rdf-12"] }
oxrdfxml = { version = "0.2", features = ["rdf-12"] }
oxttl = { version = "0.2", features = ["rdf-12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "signal", "sync", "time"] }
webbrowser = "1"
spareval = { version = "0.2", features = ["sep-0006", "sparql-12"] }
spargebra = { version = "0.4", features = ["sparql-12"] }
sparesults = { version = "0.3", features = ["sparql-12"] }
oxsdatatypes = "0.2"
regex = "1"
getrandom = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
