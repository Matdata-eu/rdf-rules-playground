name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use the release version
        if: github.event_name == 'release'
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          sed -i "s/^version = \".*\"/version = \"$TAG_VERSION\"/" Cargo.toml
          # Keep Cargo.lock in step, or the --locked build in the Dockerfile fails.
          sed -i "/^name = \"rdf-rules-playground\"$/{n;s/^version = \".*\"/version = \"$TAG_VERSION\"/}" Cargo.lock

      # Releases also get an arm64 image (Apple silicon, Graviton, Raspberry
      # Pi). Emulating arm64 is slow, so pull requests and main build amd64 only.
      - name: Set up QEMU
        if: github.event_name == 'release'
        uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ github.event_name == 'release' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # After a release, redeploy the semantics stack on Portainer so it pulls the new
  # image. The stack webhook URL is stored in the PORTAINER_SEMANTICS_WEBHOOK secret.
  deploy:
    name: Deploy
    needs: image
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy the Portainer stack
        env:
          WEBHOOK: ${{ secrets.PORTAINER_SEMANTICS_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "PORTAINER_SEMANTICS_WEBHOOK is not set, skipping."
            exit 0
          fi
          curl -fsS -X POST --max-time 300 "$WEBHOOK"
